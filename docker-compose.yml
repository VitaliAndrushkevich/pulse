services:
  pulse:
    image: ghcr.io/vitaliandrushkevich/pulse:main
    container_name: pulse
    environment:
      # Generate production keys with:
      #   openssl rand -base64 32 (secret key)
      #   openssl rand -hex 32 (jwt secret)
      PULSE_SECRET_KEY: "pulse-secret-key-change-in-production"
      PULSE_JWT_SECRET: "pulse-jwt-secret-change-in-production"
      # Replace postgres credentials for production usage.
      # Other parameters for Pulse can be found in .env.example or README.md.
      # For storing secrets, consider using a .env file.
      # In that case, the format can be kept like this:
      # PULSE_SECRET_KEY: ${PULSE_SECRET_KEY:?required}
      DATABASE_URL: "postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable"
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW  # Required for ICMP monitor (raw sockets)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.28.3-pg17
    container_name: pulse-postgres
    environment:
      # Database name created on first start
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse # Replace for production usage
    # Ports are commented out to avoid exposing the database. Uncomment if needed.
    # ports:
    #   - "5432:5432"
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pulse-postgres-data:
